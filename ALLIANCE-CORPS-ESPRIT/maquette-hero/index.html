<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alliance Corps Esprit — Entrer en amitié avec soi</title>
<meta name="description" content="Sophrologie, hypnose ericksonienne et relation d'aide à La Destrousse, près d'Aubagne. Nawal Billali, sophrologue et hypnologue.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&display=swap">
<style>
:root{
  --ink:#2b211a;
  --sand:#e9dccb;
  --ember:#b5643c;
  --nav-gap:clamp(1.1rem,2.2vw,2.15rem);
  --pad-x:clamp(1.25rem,4vw,3.6rem);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in-out:cubic-bezier(.76,0,.24,1);
  --poster:url("hero-poster.jpg");
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background:var(--sand);overflow-x:hidden;
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
body.menu-open{overflow:hidden}

/* ---------- HERO ---------- */
.hero{position:relative;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;background:var(--sand)}
.hero__media{position:absolute;inset:0;z-index:0;transform:scale(1.08);filter:blur(14px);opacity:0;
  animation:mediaIn 1.9s var(--ease) .1s forwards}
.hero__media img,.hero__media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%;display:block}
.hero__media img{z-index:1}
.hero__media video{z-index:2;opacity:0;transition:opacity 1.2s ease}
.hero__media video.is-ready{opacity:1}
.hero__media::before{content:"";position:absolute;inset:-8%;z-index:0;display:none;
  background:var(--poster) center 22%/cover no-repeat;filter:blur(30px) saturate(104%);transform:scale(1.05)}
.hero__media::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:
  linear-gradient(to bottom,rgba(246,238,227,.62) 0%,rgba(246,238,227,.22) 34%,rgba(246,238,227,0) 58%),
  radial-gradient(120% 70% at 50% 0%,rgba(255,250,242,.38),rgba(255,250,242,0) 60%)}
@keyframes mediaIn{to{transform:scale(1);filter:blur(0);opacity:1}}

/* ---------- NAV ---------- */
.nav{position:relative;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:clamp(1.1rem,2.4vw,1.9rem) var(--pad-x)}
.logo{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(1.45rem,2.2vw,1.8rem);line-height:1;letter-spacing:.005em;white-space:nowrap}
.logo em{color:var(--ember)}
.nav__links{display:flex;gap:var(--nav-gap);list-style:none;margin:0;padding:0;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.nav__links a{font-size:clamp(.95rem,1.05vw,1.05rem);letter-spacing:.005em;padding:.15rem 0;display:inline-block;position:relative}
.nav__links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.nav__links a:hover::after{transform:scaleX(1);transform-origin:left}
.nav__right{display:flex;align-items:center;gap:.6rem}
.btn-play{background:var(--ink);color:#f6eee3;border-radius:999px;padding:.78rem 1.3rem;font-size:.95rem;line-height:1;white-space:nowrap;
  transition:transform .45s var(--ease),background-color .45s var(--ease),box-shadow .45s var(--ease)}
.btn-play:hover{transform:translateY(-2px);background:#3d3027;box-shadow:0 10px 24px -12px rgba(43,33,26,.6)}
.btn-play:active{transform:translateY(0)}

.burger{display:none;width:44px;height:44px;margin-right:-8px;position:relative;z-index:60;border-radius:8px;flex:0 0 auto}
.burger span{position:absolute;left:11px;width:22px;height:1.6px;background:var(--ink);border-radius:2px;
  transition:transform .55s var(--ease-in-out),opacity .3s ease,width .55s var(--ease-in-out)}
.burger span:nth-child(1){top:17px}
.burger span:nth-child(2){top:22px;width:15px}
.burger span:nth-child(3){top:27px}
.burger.is-active span:nth-child(1){transform:translateY(5px) rotate(45deg)}
.burger.is-active span:nth-child(2){opacity:0;transform:translateX(10px)}
.burger.is-active span:nth-child(3){transform:translateY(-5px) rotate(-45deg)}

/* ---------- HEADLINE (top-anchored, never centered over the subject) ---------- */
.hero__inner{position:relative;z-index:10;flex:1;display:flex;justify-content:center;
  padding:clamp(1.5rem,5vh,4.5rem) var(--pad-x) 0;pointer-events:none}
.headline{margin:0;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(2.7rem,6.3vw,6.75rem);
  line-height:1.06;letter-spacing:-.005em;text-align:center}
.headline em{color:var(--ember)}
.headline br.m{display:none}
.line{display:block;overflow:hidden;white-space:nowrap;padding-bottom:.06em;margin-bottom:-.06em}
.line>span{display:block;transform:translateY(110%);opacity:0;animation:lineUp 1.25s var(--ease) forwards}
.line:nth-child(1)>span{animation-delay:.55s}
.line:nth-child(2)>span{animation-delay:.68s}
@keyframes lineUp{to{transform:translateY(0);opacity:1}}

/* ---------- bottom details: place + breathing guide ---------- */
.hero__foot{position:absolute;left:var(--pad-x);right:var(--pad-x);bottom:clamp(1.2rem,4vh,2.6rem);z-index:10;
  display:flex;justify-content:flex-end;align-items:flex-end;color:var(--ink);font-size:.9rem;pointer-events:none}
.hero__foot .place{letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;opacity:.78;line-height:1.7}
.breath{display:flex;align-items:center;gap:.9rem}
.orb{position:relative;width:58px;height:58px}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(43,33,26,.35)}
.orb::after{content:"";position:absolute;inset:15px;border-radius:50%;background:radial-gradient(circle,#f3c08f,rgba(181,100,60,.55));
  animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.55);opacity:.75}45%,55%{transform:scale(1.6);opacity:1}}
.breath .lbl{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:1.25rem;position:relative;height:1.4rem;width:6.5rem}
.breath .lbl span{position:absolute;inset:0;animation:swap 10s ease-in-out infinite}
.breath .lbl span+span{animation-delay:-5s}
@keyframes swap{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}

/* ---------- entrance stagger ---------- */
.rise{opacity:0;transform:translateY(-14px);animation:rise .95s var(--ease) forwards}
.hero__foot.rise{transform:translateY(14px)}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.18s}.d2{animation-delay:.26s}.d3{animation-delay:.32s}.d4{animation-delay:.38s}.d5{animation-delay:.44s}.d6{animation-delay:.52s}.d7{animation-delay:1.1s}

/* ---------- MOBILE MENU ---------- */
.menu{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad-x);
  background:rgba(240,231,219,.92);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
  clip-path:inset(0 0 100% 0);visibility:hidden;
  transition:clip-path .85s var(--ease-in-out),visibility 0s linear .85s}
.menu.is-open{clip-path:inset(0 0 0 0);visibility:visible;transition:clip-path .85s var(--ease-in-out),visibility 0s linear 0s}
.menu__list{list-style:none;margin:0;padding:0}
.menu__list li{overflow:hidden}
.menu__list a{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(2.35rem,12vw,3.4rem);line-height:1.22;padding:.12em 0;display:block;
  transform:translateY(115%);opacity:0;transition:transform .8s var(--ease),opacity .6s ease}
.menu.is-open .menu__list a{transform:translateY(0);opacity:1}
.menu.is-open .menu__list li:nth-child(1) a{transition-delay:.26s}
.menu.is-open .menu__list li:nth-child(2) a{transition-delay:.33s}
.menu.is-open .menu__list li:nth-child(3) a{transition-delay:.40s}
.menu.is-open .menu__list li:nth-child(4) a{transition-delay:.47s}
.menu__rule{height:1px;background:rgba(43,33,26,.16);margin:2.2rem 0 0;transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease)}
.menu.is-open .menu__rule{transform:scaleX(1);transition-delay:.5s}
.menu__foot{margin-top:2.2rem;opacity:0;transform:translateY(22px);transition:transform .8s var(--ease),opacity .6s ease;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.menu.is-open .menu__foot{opacity:1;transform:translateY(0);transition-delay:.56s}
.menu__foot .btn-play{display:inline-block;padding:.95rem 1.6rem;font-size:1rem}
.menu__foot .tel{font-family:"Instrument Serif",Georgia,serif;font-size:1.35rem}

/* ---------- RESPONSIVE ---------- */
@media (max-width:900px){
  .nav__links,.nav__right .btn-play{display:none}
  .burger{display:block}
  .hero__media video,.hero__media img{object-position:center 60%}
  .hero__inner{align-items:flex-start}
  .headline br.m{display:inline}
  .headline{font-size:clamp(2.4rem,6.4vw,3.6rem)}
}
@media (max-width:900px) and (orientation:portrait){
  .hero__media::before{display:block}
  .hero__media video,.hero__media img{top:auto;bottom:0;height:64svh;object-position:74% 62%;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.6) 9%,#000 20%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.6) 9%,#000 20%)}
  .hero__foot{display:none}
}
@media (max-width:560px){
  .headline{font-size:clamp(2.15rem,10.5vw,3.1rem);line-height:1.1}
  .hero__inner{padding-top:clamp(1.75rem,7vh,3rem)}
}
@media (max-width:380px){.headline{font-size:2.1rem}}
@media (max-height:520px) and (orientation:landscape){
  .headline{font-size:clamp(1.7rem,5vw,2.4rem);max-width:22ch}
  .hero__inner{padding-top:.75rem}
  .menu__list a{font-size:clamp(1.4rem,5vw,1.9rem)}
  .menu__rule{margin-top:1.2rem}.menu__foot{margin-top:1.2rem}
  .hero__foot{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .hero__media{opacity:1;transform:none;filter:none}
  .line>span{transform:none;opacity:1}
  .rise{opacity:1;transform:none}
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero__media">
    <img src="hero-poster.jpg" alt="Une personne en relaxation allongée sur un tapis, un coussin sous les genoux, dans une pièce baignée de lumière dorée">
    <video id="heroVideo" autoplay muted loop playsinline preload="auto" poster="hero-poster.jpg" aria-hidden="true">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_3KPnPl19D9JuyhsM2qDki5awzVK/hf_20261008_140844_d34604c0-5e6c-4817-a60e-d8fb09785df3.mp4" type="video/mp4">
    </video>
  </div>

  <header class="nav">
    <a class="logo rise d1" href="#" aria-label="Alliance Corps Esprit — accueil">Alliance <em>Corps</em> Esprit</a>
    <nav aria-label="Principale">
      <ul class="nav__links">
        <li class="rise d2"><a href="#cabinet">Le cabinet</a></li>
        <li class="rise d3"><a href="#sophrologie">Sophrologie</a></li>
        <li class="rise d4"><a href="#hypnose">Hypnose</a></li>
        <li class="rise d5"><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="nav__right">
      <a class="btn-play rise d6" href="https://liberlo.com/profil/nawal-billali">Prendre rendez-vous</a>
      <button class="burger rise d6" id="burger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <div class="hero__inner">
    <h1 class="headline">
      <span class="line"><span>Entrer en <em>amitié</em><br class="m"> avec soi,</span></span>
      <span class="line"><span>ici et maintenant.</span></span>
    </h1>
  </div>

  <div class="hero__foot rise d7">
    <div class="breath" aria-hidden="true"><div class="lbl"><span>Inspirez…</span><span>Expirez…</span></div><div class="orb"></div></div>
  </div>
</section>

<div class="menu" id="menu">
  <nav aria-label="Mobile">
    <ul class="menu__list">
      <li><a href="#cabinet">Le cabinet</a></li>
      <li><a href="#sophrologie">Sophrologie</a></li>
      <li><a href="#hypnose">Hypnose</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
  <div class="menu__rule"></div>
  <div class="menu__foot">
    <a class="btn-play" href="https://liberlo.com/profil/nawal-billali">Prendre rendez-vous</a>
    <a class="tel" href="tel:0676486927">06 76 48 69 27</a>
  </div>
</div>

<script>
(function () {
  var menu = document.getElementById('menu'), burger = document.getElementById('burger'), open = false;
  function setMenu(next) {
    open = next;
    menu.classList.toggle('is-open', open);
    burger.classList.toggle('is-active', open);
    document.body.classList.toggle('menu-open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    burger.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
  }
  burger.addEventListener('click', function () { setMenu(!open); });
  menu.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) setMenu(false); });
  window.addEventListener('resize', function () { if (open && window.innerWidth > 900) setMenu(false); });

  var video = document.getElementById('heroVideo');
  function reveal() { video.classList.add('is-ready'); }
  if (video.readyState >= 3) reveal(); else video.addEventListener('loadeddata', reveal, { once: true });
  function kick() { var p = video.play(); if (p && p.catch) p.catch(function () {}); }
  kick();
  window.addEventListener('touchstart', kick, { once: true, passive: true });
  window.addEventListener('click', kick, { once: true });
})();
</script>
</body>
</html>

services:
  alliancecorpsesprit:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.alliancecorpsesprit.fr}
    image: alliancecorpsesprit:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL}
      - CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.alliancecorpsesprit.fr}
    networks:
      - web
    labels:
      caddy: ${SITE_DOMAINS:-alliancecorpsesprit.fr, www.alliancecorpsesprit.fr}
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  web:
    external: true

services:
  alliance-corps-esprit:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://alliance.s-fservices.fr}
    image: alliance-corps-esprit:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://alliance.s-fservices.fr}
      # Formulaire de contact (Resend) — voir .env.example
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL:-}
      - CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL:-}
    networks:
      - web
    labels:
      caddy: ${CADDY_DOMAINS:-alliance.s-fservices.fr}
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  web:
    external: true

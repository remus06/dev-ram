services:
  alliance-corps-esprit:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.alliancecorpsesprit.fr}
    image: alliance-corps-esprit:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.alliancecorpsesprit.fr}
    networks:
      - web
    labels:
      caddy: ${CADDY_DOMAINS:-alliancecorpsesprit.fr, www.alliancecorpsesprit.fr}
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  web:
    external: true

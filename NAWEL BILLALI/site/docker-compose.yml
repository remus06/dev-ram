services:
  alliance-corps-esprit:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://s-fservices.fr}
    image: alliance-corps-esprit:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://s-fservices.fr}
      - NEXT_PUBLIC_ALLOW_INDEXING=${NEXT_PUBLIC_ALLOW_INDEXING:-false}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_TO=${MAIL_TO}
    networks:
      - web
    labels:
      caddy: ${SITE_DOMAIN:-s-fservices.fr}
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  web:
    external: true
